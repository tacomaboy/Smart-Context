[project]
name = "smart-context"
version = "0.1.0"
description = "Local context manager for Claude API traffic: a cache-safe filtering proxy with recall."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
bakeoff = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
smart-context = "smartcontext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcontext"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
